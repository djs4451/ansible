---
- name: Create secure S3 bucket (version safe)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: eu-north-1
    bucket_name: "ansible-demo-s3"

  tasks:

    - name: Create bucket + security + encryption + versioning
      amazon.aws.s3_bucket:
        name: "{{ bucket_name }}"
        region: "{{ region }}"
        state: present
        versioning: true
        encryption: AES256
        object_ownership: BucketOwnerEnforced
        public_access:
          block_public_acls: true
          block_public_policy: true
          ignore_public_acls: true
          restrict_public_buckets: true
        tags:
          Environment: Dev
          CreatedBy: Ansible

    - debug:
        msg: "S3 bucket ready: {{ bucket_name }}"

