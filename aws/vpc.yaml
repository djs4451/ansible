---
- name: Create VPC, Subnet, SG and EC2 Instance
  hosts: localhost
  connection: local
  gather_facts: no

  vars:

    region: ap-south-1

    vpc_cidr: 10.10.0.0/16
    subnet_cidr: 10.10.1.0/24

    vpc_name: ansible-vpc
    subnet_name: ansible-subnet
    sg_name: ansible-sg

    instance_name: ansible-ec2

    ami_id: ami-0f5ee92e2d63afc18   # Amazon Linux 2 (Mumbai)
    instance_type: t2.micro
    key_name: mumbai-key


  tasks:

  - name: Create VPC
    amazon.aws.ec2_vpc_net:
      name: "{{ vpc_name }}"
      cidr_block: "{{ vpc_cidr }}"
      region: "{{ region }}"
      state: present
    register: vpc


  - name: Create Subnet
    amazon.aws.ec2_vpc_subnet:
      vpc_id: "{{ vpc.vpc.id }}"
      cidr: "{{ subnet_cidr }}"
      region: "{{ region }}"
      state: present
      tags:
        Name: "{{ subnet_name }}"
    register: subnet


  - name: Create Internet Gateway
    amazon.aws.ec2_vpc_igw:
      vpc_id: "{{ vpc.vpc.id }}"
      region: "{{ region }}"
      state: present
    register: igw


  - name: Create Route Table
    amazon.aws.ec2_vpc_route_table:
      vpc_id: "{{ vpc.vpc.id }}"
      region: "{{ region }}"
      subnets:
        - "{{ subnet.subnet.id }}"
      routes:
        - dest: 0.0.0.0/0
          gateway_id: "{{ igw.gateway_id }}"
      tags:
        Name: ansible-rt


  - name: Create Security Group
    amazon.aws.ec2_security_group:
      name: "{{ sg_name }}"
      description: Allow SSH
      vpc_id: "{{ vpc.vpc.id }}"
      region: "{{ region }}"
      rules:

        - proto: tcp
          ports: 22
          cidr_ip: 0.0.0.0/0

        - proto: tcp
          ports: 80
          cidr_ip: 0.0.0.0/0

      state: present
    register: sg


  - name: Launch EC2 Instance
    amazon.aws.ec2_instance:

      name: "{{ instance_name }}"
      key_name: "{{ key_name }}"

      instance_type: "{{ instance_type }}"
      image_id: "{{ ami_id }}"

      vpc_subnet_id: "{{ subnet.subnet.id }}"

      security_group: "{{ sg.group_id }}"

      region: "{{ region }}"

      network:
        assign_public_ip: true

      wait: yes

      tags:
        Environment: Dev

    register: ec2


  - name: Show Instance Info
    debug:
      var: ec2.instances[0].public_ip_address

