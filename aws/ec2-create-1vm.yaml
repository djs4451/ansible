---
- name: Create EC2 instance in AWS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: eu-north-1
    key_name: ansible
    instance_type: t3.micro
    ami_id: ami-08526b399bb6eb2c7   # RHEL 10 (eu-north-1)
      #    security_group: web-sg
      #   subnet_id: subnet-xxxxxxxx
    instance_name: ansible-ec2-demo

  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        region: "{{ region }}"
        wait: true
        count: 1
          #        vpc_subnet_id: "{{ subnet_id }}"
          #        security_group: "{{ security_group }}"
        network:
          assign_public_ip: true
        tags:
          Environment: Dev
          CreatedBy: Ansible
      register: ec2_output

    - name: Display EC2 instance details
      debug:
        msg:
          - "Instance ID: {{ ec2_output.instances[0].instance_id }}"
          - "Public IP: {{ ec2_output.instances[0].public_ip_address }}"

