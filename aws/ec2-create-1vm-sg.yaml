---
- name: Create EC2 instance in AWS with SSH access
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: eu-north-1
    key_name: ansible
    instance_type: t3.micro
    ami_id: ami-08526b399bb6eb2c7
    instance_name: ansible-ec2-demo
    sg_name: ansible-ssh-sg
    sg_description: Allow SSH access from anywhere

  tasks:
    - name: Create security group for SSH access
      amazon.aws.ec2_security_group:
        region: "{{ region }}"
        name: "{{ sg_name }}"
        description: "{{ sg_description }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow SSH from anywhere
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present
      register: sg_result

    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        region: "{{ region }}"
        name: "{{ instance_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        wait: true
        count: 1

        network_interfaces:
          - device_index: 0
            assign_public_ip: true
            groups:
              - "{{ sg_result.group_id }}"

        tags:
          Environment: Dev
          CreatedBy: Ansible
      register: ec2_output

    - name: Display EC2 instance details
      debug:
        msg:
          - "Instance ID: {{ ec2_output.instances[0].instance_id }}"
          - "Public IP: {{ ec2_output.instances[0].public_ip_address }}"

