- name: Provision multiple VMs in vSphere
  hosts: localhost
  gather_facts: no

  collections:
    - community.vmware

  vars:
    vcenter: vc.lab.local
    user: administrator@vsphere.local
    pass: VMware@123
    dc: DC1
    cluster: PROD
    datastore: shared01
    network: VM_Network
    domain_name: corp.lab.local
    domain_user: admin@corp.lab.local
    domain_pass: Password123!

    vm_fleet:
      - name: web01
        ip: 192.168.10.101
        tier: web
      - name: web02
        ip: 192.168.10.102
        tier: web
      - name: app01
        ip: 192.168.10.201
        tier: app
      - name: db01
        ip: 192.168.10.50
        tier: db

  tasks:
    - name: Deploy VM fleet
      vmware_guest:
        hostname: "{{ vcenter }}"
        username: "{{ user }}"
        password: "{{ pass }}"
        validate_certs: no
        datacenter: "{{ dc }}"
        cluster: "{{ cluster }}"
        template: rocky-template-{{ item.tier }}
        name: "{{ item.name }}"
        datastore: "{{ datastore }}"
        state: poweredon
        networks:
          - name: "{{ network }}"
            ip: "{{ item.ip }}"
            netmask: 255.255.255.0
            gateway: 192.168.10.1
        customization:
          hostname: "{{ item.name }}"
        tags:
          - "tier:{{ item.tier }}"
          - site:primary
          - env:prod
      loop: "{{ vm_fleet }}"

