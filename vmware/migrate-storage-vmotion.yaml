- name: Live migrate VM storage to another datastore
  hosts: localhost
  gather_facts: no

  collections:
    - community.vmware

  vars:
    vcenter: vc.lab.local
    user: administrator@vsphere.local
    pass: VMware@123
    dc: DC1
    vm_name: app01

    target_datastore: fast-ssd

  tasks:
    - name: Storage vMotion VM disks
      vmware_guest:
        hostname: "{{ vcenter }}"
        username: "{{ user }}"
        password: "{{ pass }}"
        validate_certs: no
        datacenter: "{{ dc }}"
        name: "{{ vm_name }}"
        datastore: "{{ target_datastore }}"
        state: poweredon

